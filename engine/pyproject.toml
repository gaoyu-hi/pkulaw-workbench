[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pkulaw-engine"
version = "0.2.2"
description = "Local Python engine for the Pkulaw Electron workbench"
requires-python = ">=3.12"
dependencies = [
  "DrissionPage==4.1.1.4",
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
  "xlrd==2.0.2"
]

[project.optional-dependencies]
test = [
  "coverage==7.17.0",
  "xlwt==1.3.0"
]

[tool.setuptools]
packages = ["pkulaw_engine"]
